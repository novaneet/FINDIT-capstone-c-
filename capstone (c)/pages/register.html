<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register | FINDIT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/responsive.css" />
  </head>
  <body data-page="register">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="../index.html" class="brand"><span class="brand-mark">F</span><span>FINDIT</span></a>
        <nav class="main-nav">
          <a href="../index.html" class="nav-link">Home</a>
          <a href="browse.html" class="nav-link">Browse Items</a>
          <a href="report-lost.html" class="nav-link">Report Lost</a>
          <a href="report-found.html" class="nav-link">Report Found</a>
          <a href="login.html" class="nav-link active">Login/Profile</a>
        </nav>
      </div>
    </header>

    <main class="auth-shell section-pad">
      <div class="container auth-grid centered">
        <section class="auth-panel wide-panel">
          <p class="eyebrow">Create account</p>
          <h1>Join FINDIT</h1>
          <form id="register-form" class="stacked-form">
            <div class="form-grid two-col">
              <label>
                <span>Full name</span>
                <input type="text" id="register-name" placeholder="Your name" required />
              </label>
              <label>
                <span>Email</span>
                <input type="email" id="register-email" placeholder="name@college.edu" required />
              </label>
              <label>
                <span>Password</span>
                <input type="password" id="register-password" placeholder="Minimum 6 characters" required />
              </label>
              <label>
                <span>Role</span>
                <select id="register-role">
                  <option value="student">Student</option>
                  <option value="staff">Staff</option>
                  <option value="admin">Administrator</option>
                </select>
              </label>
            </div>
            <button type="submit" class="btn btn-primary">Register</button>
          </form>
          <p class="auth-alt-link">Already have an account? <a href="login.html">Login</a></p>
        </section>
      </div>
    </main>

    <div id="app-message" class="app-message info"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/config.js"></script>
    <script src="../js/app.js"></script>
    <script src="../js/supabase.js"></script>
    <script src="../js/auth.js"></script>
  </body>
</html>
